name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download UserLAndLibrary forcefully
        run: |
          rm -rf UserLAndLibrary
          git clone https://github.com/RakhithJK/UserLAndLibrary.git UserLAndLibrary

      - name: Patch UserLAndLibrary for Modern Gradle
        run: |
          # Fix the deprecated 'enabled' syntax that crashes Gradle 8
          sed -i 's/xml.enabled.*/xml.required.set(true)/g' UserLAndLibrary/app/build.gradle
          sed -i 's/html.enabled.*/html.required.set(true)/g' UserLAndLibrary/app/build.gradle
          # Strip out the dead kotlin-android-extensions plugin
          sed -i "s/apply plugin: 'kotlin-android-extensions'//g" UserLAndLibrary/app/build.gradle
          sed -i 's/id "kotlin-android-extensions"//g' UserLAndLibrary/app/build.gradle
          sed -i "s/id 'kotlin-android-extensions'//g" UserLAndLibrary/app/build.gradle
          # Delete the leftover configuration block for the dead plugin
          sed -i '/androidExtensions {/,/}/d' UserLAndLibrary/app/build.gradle

      - name: Set up Java 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permissions for Gradle
        run: chmod +x ./gradlew

      - name: Compile the App
        run: ./gradlew assembleDebug

      - name: Upload the compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxBox-APK
          path: app/build/outputs/apk/**/*.apk
