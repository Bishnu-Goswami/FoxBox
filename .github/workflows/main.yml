name: Build Android APK
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 
        uses: actions/setup-java@v4
        with:
          java-version: '17' # If the build fails later, change this to '11' for older projects
          distribution: 'temurin'

      - name: Grant execute permissions for Gradle
        run: chmod +x ./gradlew

      - name: Compile the App
        run: ./gradlew assembleDebug

      - name: Upload the compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxBox-APK
          path: app/build/outputs/apk/debug/*.apk
