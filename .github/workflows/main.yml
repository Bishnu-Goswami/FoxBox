name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download UserLAndLibrary forcefully
        run: |
          rm -rf UserLAndLibrary
          git clone https://github.com/RakhithJK/UserLAndLibrary.git UserLAndLibrary

      - name: Set up Java 
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permissions for Gradle
        run: chmod +x ./gradlew

      - name: Compile the App
        run: ./gradlew assembleDebug

      - name: Upload the compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxBox-APK
          path: app/build/outputs/apk/**/*.apk
