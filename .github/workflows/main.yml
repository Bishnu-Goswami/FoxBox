name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download UserLAndLibrary and Submodules One-by-One
        run: |
          rm -rf UserLAndLibrary
          
          # 1. Clone the library directly
          git clone https://github.com/RakhithJK/UserLAndLibrary.git UserLAndLibrary
          cd UserLAndLibrary
          
          # 2. Patch dead URLs in .gitmodules
          sed -i 's/CypherpunkArmory/RakhithJK/g' .gitmodules || true
          git submodule sync || true
          git submodule init || true
          
          # 3. Update them ONE BY ONE. If one fails, it prints a warning and CONTINUES downloading the rest!
          for sub in $(git config --file .gitmodules --get-regexp path | awk '{ print $2 }'); do
            echo "Downloading $sub..."
            git submodule update --init "$sub" || echo "WARNING: Failed to fetch $sub, continuing..."
          done
          
          # 4. Nuke the .git folder so GitHub Actions' post-checkout cleanup doesn't crash on dead links
          rm -rf .git
          cd ..

      - name: The Ultimate Modern Gradle Patch
        run: |
          # Strip out dead kotlin-android-extensions from EVERY build.gradle file
          find . -name "build.gradle" -exec sed -i "s/apply plugin: 'kotlin-android-extensions'//g" {} +
          find . -name "build.gradle" -exec sed -i 's/id "kotlin-android-extensions"//g' {} +
          find . -name "build.gradle" -exec sed -i "s/id 'kotlin-android-extensions'//g" {} +
          find . -name "build.gradle" -exec sed -i '/androidExtensions {/,/}/d' {} +
          
          # Fix old Gradle reporting syntax globally
          find . -name "build.gradle" -exec sed -i 's/xml.enabled.*/xml.required.set(true)/g' {} +
          find . -name "build.gradle" -exec sed -i 's/html.enabled.*/html.required.set(true)/g' {} +
          
          # Dynamically inject Namespace and BuildConfig into EVERY module automatically
          for manifest in $(find . -path "*/src/main/AndroidManifest.xml"); do
            module_dir=$(echo "$manifest" | sed 's|/src/main/AndroidManifest.xml||')
            build_gradle="$module_dir/build.gradle"
            if [ -f "$build_gradle" ]; then
              pkg=$(grep -oP 'package="\K[^"]+' "$manifest" | head -n 1)
              if [ ! -z "$pkg" ]; then
                sed -i "s/android {/android {\n    namespace \"$pkg\"\n    buildFeatures.buildConfig = true/g" "$build_gradle"
              fi
            fi
          done

      - name: Set up Java 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permissions for Gradle
        run: chmod +x ./gradlew

      - name: Compile the App
        run: ./gradlew assembleDebug

      - name: Upload the compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxBox-APK
          path: app/build/outputs/apk/**/*.apk
